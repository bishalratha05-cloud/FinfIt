<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FinfIt{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">Finf<span>It</span></a>
  <nav>
    <a href="{{ url_for('index') }}">Search</a>
    <a href="{{ url_for('upload') }}">Documents</a>
    <a href="{{ url_for('history') }}">History</a>
    <a href="{{ url_for('about') }}">About</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for category, message in messages %}
      <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>FinfIt · Educational Information Retrieval System</footer>
</body>
</html>
